[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stratlib"
version = "0.1.0"
description = "Local stock screener and strategy library backed by Financial Modeling Prep data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "tzdata>=2024.1",
    "pandas>=2.2,<3",
    "nicegui>=3.17,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
]

[project.scripts]
stratlib = "stratlib.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stratlib = ["static/fonts/*", "web/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
